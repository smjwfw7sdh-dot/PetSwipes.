<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>PetSwipe – Matching responsable de mascotas</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --rojo: #C41E3A;
      --rojo-oscuro: #9B1830;
      --verde: #2E7D32;
      --gris-suave: #F5F5F7;
      --gris-texto: #6B7280;
      --texto: #1F2937;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #E5E7EB;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .phone {
      width: 390px;
      height: 844px;
      background: #000;
      border-radius: 48px;
      padding: 11px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.45);
      position: relative;
    }

    .phone-inner {
      width: 100%;
      height: 100%;
      background: #fff;
      border-radius: 38px;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .notch {
      position: absolute;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 160px; height: 34px;
      background: #000;
      border-radius: 0 0 20px 20px;
      z-index: 100;
    }

    .status-bar {
      height: 50px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 24px;
      font-size: 15px;
      font-weight: 600;
      color: #1F2937;
      z-index: 50;
    }

    .screen {
      display: none;
      flex: 1;
      flex-direction: column;
      overflow-y: auto;
      background: #fff;
      position: relative;
    }
    .screen.active { display: flex; }

    /* ===================== SPLASH ===================== */
    .splash {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 28px 40px;
      background: linear-gradient(180deg, #FFF5F5 0%, #FFFFFF 55%);
      text-align: center;
    }

    .logo-area {
      margin-top: 30px;
      margin-bottom: 18px;
    }

    .logo-area svg {
      width: 150px;
      height: 150px;
    }

    .splash h1 {
      font-size: 36px;
      font-weight: 700;
      color: var(--rojo);
      margin-bottom: 14px;
      letter-spacing: -0.8px;
    }

    .value-prop {
      font-size: 15.5px;
      color: var(--gris-texto);
      line-height: 1.55;
      max-width: 290px;
      margin-bottom: auto; /* empuja el botón hacia abajo */
    }

    /* BOTÓN HUELLA DE PERRO */
    .btn-huella {
      width: 110px;
      height: 110px;
      border: none;
      background: var(--rojo);
      cursor: pointer;
      position: relative;
      margin-bottom: 30px;
      /* Forma de huella usando clip-path */
      clip-path: polygon(
        30% 0%, 70% 0%,
        100% 30%, 100% 70%,
        70% 100%, 30% 100%,
        0% 70%, 0% 30%
      );
      border-radius: 40%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 30px rgba(196, 30, 58, 0.4);
      transition: transform 0.15s, background 0.15s;
    }

    .btn-huella:active {
      transform: scale(0.93);
      background: var(--rojo-oscuro);
    }

    .btn-huella svg {
      width: 36px;
      height: 36px;
      fill: white;
      margin-bottom: 2px;
    }

    .btn-huella span {
      color: white;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }

    /* Versión alternativa más realista de huella (recomendada) */
    .btn-paw-real {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-bottom: 25px;
    }

    .paw-shape {
      width: 96px;
      height: 96px;
      background: var(--rojo);
      border-radius: 50% 50% 45% 45%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 28px rgba(196, 30, 58, 0.38);
      transition: transform 0.15s;
    }

    .paw-shape:active {
      transform: scale(0.94);
    }

    /* Almohadillas de la huella */
    .paw-shape::before {
      content: "";
      position: absolute;
      width: 22px; height: 28px;
      background: var(--rojo);
      border-radius: 50%;
      top: -16px; left: 12px;
      box-shadow: 
        28px 0 0 var(--rojo),
        14px -12px 0 var(--rojo);
    }

    .paw-shape svg {
      width: 32px;
      height: 32px;
      fill: white;
      z-index: 2;
    }

    .btn-paw-real span {
      font-size: 15px;
      font-weight: 600;
      color: var(--rojo);
    }

    /* Resto de estilos (se mantienen iguales a la versión anterior) */
    .header {
      padding: 12px 20px 16px;
      background: #fff;
      border-bottom: 1px solid #F3F4F6;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header .back {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: var(--gris-suave);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; cursor: pointer;
    }
    .header h2 { font-size: 18px; font-weight: 600; flex: 1; }

    .form-content { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
    .photo-upload { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-bottom: 6px; }
    .photo-circle {
      width: 100px; height: 100px; border-radius: 50%;
      background: var(--gris-suave); border: 3px dashed #D1D5DB;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: var(--gris-texto); font-size: 13px; cursor: pointer;
    }
    .photo-circle span { font-size: 26px; }

    .form-group label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 14px 16px; border: 1.5px solid #E5E7EB;
      border-radius: 12px; font-size: 15px; font-family: inherit; outline: none;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--rojo); }
    .form-group textarea { min-height: 78px; resize: none; }

    .radio-group { display: flex; gap: 10px; }
    .radio-option {
      flex: 1; padding: 12px; border: 1.5px solid #E5E7EB; border-radius: 12px;
      text-align: center; font-size: 14px; font-weight: 500; cursor: pointer;
    }
    .radio-option.active { border-color: var(--rojo); background: #FEF2F2; color: var(--rojo); }

    .btn-fixed { padding: 16px 20px 30px; background: #fff; border-top: 1px solid #F3F4F6; }
    .btn-primary {
      background: var(--rojo); color: white; border: none; padding: 16px;
      border-radius: 16px; font-size: 17px; font-weight: 600; width: 100%;
      box-shadow: 0 4px 14px rgba(196,30,58,0.3);
    }

    .matches-list { padding: 12px 20px 20px; display: flex; flex-direction: column; gap: 16px; }
    .matches-header { padding: 4px 20px 10px; font-size: 14px; color: var(--gris-texto); }

    .pet-card {
      background: #fff; border-radius: 20px; overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08); border: 1px solid #F3F4F6;
    }
    .pet-card img { width: 100%; height: 180px; object-fit: cover; }
    .pet-card-body { padding: 16px; }
    .pet-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
    .pet-card h3 { font-size: 18px; font-weight: 600; }
    .compat { background: #E8F5E9; color: var(--verde); font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 20px; }
    .pet-meta { font-size: 13px; color: var(--gris-texto); margin-bottom: 8px; }
    .pet-desc { font-size: 14px; color: var(--texto); line-height: 1.4; margin-bottom: 10px; }
    .fundacion { font-size: 12px; color: var(--gris-texto); }
    .fundacion::before { content: "✓ "; color: var(--verde); font-weight: 700; }

    .detail-hero { width: 100%; height: 280px; object-fit: cover; }
    .detail-content { padding: 20px; }
    .detail-title { font-size: 26px; font-weight: 700; margin-bottom: 8px; }
    .detail-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
    .tag { background: var(--gris-suave); font-size: 13px; padding: 6px 12px; border-radius: 20px; font-weight: 500; }
    .section { margin-bottom: 18px; }
    .section h4 { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
    .section p, .section ul { font-size: 14px; color: var(--gris-texto); line-height: 1.5; }
    .section ul { list-style: none; }
    .section li { margin-bottom: 5px; }
    .section li::before { content: "✓ "; color: var(--verde); font-weight: 700; }

    .process-content { padding: 30px 24px; text-align: center; }
    .success-icon { width: 80px; height: 80px; background: #E8F5E9; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 18px; font-size: 36px; }
    .steps { display: flex; justify-content: space-between; position: relative; margin: 30px 0 36px; }
    .steps::before { content: ""; position: absolute; top: 18px; left: 30px; right: 30px; height: 3px; background: #E5E7EB; }
    .step { display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 1; width: 70px; }
    .step-circle { width: 36px; height: 36px; border-radius: 50%; background: #E5E7EB; color: var(--gris-texto); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; }
    .step.active .step-circle, .step.completed .step-circle { background: var(--verde); color: white; }
    .step span { font-size: 12px; color: var(--gris-texto); }
    .step.active span { color: var(--verde); font-weight: 600; }
    .info-box { background: #F0FDF4; border-radius: 16px; padding: 16px; text-align: left; font-size: 14px; line-height: 1.5; }

    .follow-content { padding: 24px 20px; }
    .timeline-item { display: flex; gap: 16px; margin-bottom: 22px; position: relative; }
    .timeline-item:not(:last-child)::after { content: ""; position: absolute; left: 15px; top: 34px; bottom: -22px; width: 2px; background: #E5E7EB; }
    .timeline-dot { width: 32px; height: 32px; border-radius: 50%; background: #E5E7EB; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
    .timeline-item.completed .timeline-dot { background: var(--verde); color: white; }
    .timeline-item.current .timeline-dot { background: var(--rojo); color: white; }
    .timeline-body h4 { font-size: 16px; font-weight: 600; margin-bottom: 3px; }
    .timeline-body p { font-size: 13px; color: var(--gris-texto); }

    .contact-section { background: #FFF5F5; border-radius: 16px; padding: 20px; margin-top: 8px; }
    .contact-section h4 { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
    .contact-section > p { font-size: 13px; color: var(--gris-texto); margin-bottom: 14px; line-height: 1.4; }
    .contact-section input { width: 100%; padding: 13px 14px; border: 1.5px solid #E5E7EB; border-radius: 12px; font-size: 15px; margin-bottom: 11px; font-family: inherit; }
    .btn-contact { background: var(--rojo); color: white; border: none; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 600; width: 100%; }

    .profile-header { padding: 24px 20px; text-align: center; background: linear-gradient(180deg, #FFF5F5 0%, #fff 100%); }
    .avatar { width: 80px; height: 80px; border-radius: 50%; background: var(--rojo); color: white; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 700; margin: 0 auto 12px; }
    .home-cards { padding: 0 20px 30px; display: flex; flex-direction: column; gap: 14px; }
    .home-card { background: #fff; border-radius: 16px; padding: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.07); border: 1px solid #F3F4F6; }
    .home-card h3 { font-size: 15px; font-weight: 600; margin-bottom: 12px; display: flex; justify-content: space-between; }
    .count { background: var(--gris-suave); font-size: 12px; padding: 2px 8px; border-radius: 10px; }
    .mini-pets { display: flex; gap: 10px; overflow-x: auto; }
    .mini-pet { width: 62px; text-align: center; flex-shrink: 0; }
    .mini-pet img { width: 56px; height: 56px; border-radius: 14px; object-fit: cover; margin-bottom: 4px; }
    .mini-pet span { font-size: 11px; color: var(--gris-texto); }

    /* Barra de navegación del prototipo (más discreta) */
    .proto-nav {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: #111; display: flex; overflow-x: auto;
      padding: 7px 4px; gap: 3px; z-index: 200;
    }
    .proto-nav button {
      flex: 1; min-width: 68px; background: #222; color: #aaa;
      border: none; padding: 7px 3px; font-size: 10px;
      border-radius: 8px; cursor: pointer; white-space: nowrap;
    }
    .proto-nav button.active { background: var(--rojo); color: white; }

    .screen { padding-bottom: 58px; }
  </style>
</head>
<body>
<div class="phone">
  <div class="phone-inner">
    <div class="notch"></div>

    <!-- ========== 1. SPLASH ========== -->
    <div class="screen active" id="screen-1">
      <div class="status-bar">
        <span>9:41</span>
        <span>●●●●</span>
      </div>
      <div class="splash">
        <div class="logo-area">
          <!-- Logo lo más parecido posible al que enviaste -->
          <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <!-- Corazón -->
            <path d="M100 175 C35 125 5 80 40 48 C62 28 88 40 100 62 C112 40 138 28 160 48 C195 80 165 125 100 175 Z" fill="#E5394D"/>
            <!-- Perro -->
            <ellipse cx="72" cy="98" rx="30" ry="34" fill="#C41E3A"/>
            <circle cx="58" cy="86" r="9" fill="#C41E3A"/>
            <ellipse cx="50" cy="90" rx="7" ry="5" fill="#C41E3A"/>
            <!-- Gato -->
            <ellipse cx="128" cy="102" rx="24" ry="30" fill="#B71C1C"/>
            <polygon points="113,74 120,92 106,92" fill="#B71C1C"/>
            <polygon points="143,74 136,92 150,92" fill="#B71C1C"/>
            <!-- Huella blanca -->
            <ellipse cx="100" cy="148" rx="15" ry="12" fill="white"/>
            <circle cx="88" cy="137" r="5.5" fill="white"/>
            <circle cx="100" cy="132" r="5.5" fill="white"/>
            <circle cx="112" cy="137" r="5.5" fill="white"/>
            <circle cx="94" cy="129" r="4.5" fill="white"/>
            <!-- Flecha -->
            <path d="M132 158 Q155 148 168 130" stroke="#C41E3A" stroke-width="7" fill="none" stroke-linecap="round"/>
            <polygon points="168 124 178 140 160 136" fill="#C41E3A"/>
          </svg>
        </div>

        <h1>PetSwipe</h1>
        
        <p class="value-prop">
          Matching responsable de perros y gatos.<br>
          Compatibilidad real de estilo de vida<br>
          + acompañamiento post-adopción.
        </p>

        <!-- BOTÓN HUELLA -->
        <button class="btn-paw-real" onclick="goTo(2)">
          <div class="paw-shape">
            <svg viewBox="0 0 24 24"><path d="M12 2C10.9 2 10 2.9 10 4s.9 2 2 2 2-.9 2-2-.9-2-2-2zM8.5 6C7.12 6 6 7.12 6 8.5S7.12 11 8.5 11 11 9.88 11 8.5 9.88 6 8.5 6zm7 0c-1.38 0-2.5 1.12-2.5 2.5S14.12 11 15.5 11 18 9.88 18 8.5 16.88 6 15.5 6zM4.5 11C3.12 11 2 12.12 2 13.5S3.12 16 4.5 16 7 14.88 7 13.5 5.88 11 4.5 11zm15 0c-1.38 0-2.5 1.12-2.5 2.5s1.12 2.5 2.5 2.5 2.5-1.12 2.5-2.5-1.12-2.5-2.5-2.5zM12 13c-2.76 0-5 2.24-5 5v2h10v-2c0-2.76-2.24-5-5-5z"/></svg>
          </div>
          <span>Comenzar</span>
        </button>
      </div>
    </div>

    <!-- Las demás pantallas se mantienen igual que la versión anterior.
         Por longitud, aquí solo dejo la estructura. 
         Copia el resto del código de la versión anterior desde la pantalla 2 en adelante. -->

    <!-- Para que funcione completo, usa el código completo de la respuesta anterior 
         y solo reemplaza la parte del SPLASH por la que está arriba. -->

    <div class="proto-nav">
      <button class="active" onclick="goTo(1)">1. Splash</button>
      <button onclick="goTo(2)">2. Perfil</button>
      <button onclick="goTo(3)">3. Matches</button>
      <button onclick="goTo(4)">4. Detalle</button>
      <button onclick="goTo(5)">5. Proceso</button>
      <button onclick="goTo(6)">6. Seguim.</button>
      <button onclick="goTo(7)">7. Home</button>
    </div>
  </div>
</div>

<script>
  function goTo(num) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    const screen = document.getElementById('screen-' + num);
    if (screen) {
      screen.classList.add('active');
      screen.scrollTop = 0;
    }
    document.querySelectorAll('.proto-nav button').forEach((btn, i) => {
      btn.classList.toggle('active', i + 1 === num);
    });
  }

  // El resto de funciones (generarMatches, etc.) se mantienen igual
</script>
</body>
</html>
