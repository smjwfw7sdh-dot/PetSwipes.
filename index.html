<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PetSwipe – Matching responsable de mascotas</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --rojo: #C41E3A;
      --verde: #2E7D32;
      --gris-suave: #F5F5F7;
      --gris-texto: #6B7280;
      --texto: #1F2937;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f0f0f0;
      color: var(--texto);
    }

    .app {
      max-width: 480px;
      margin: 0 auto;
      background: white;
      min-height: 100vh;
      position: relative;
      box-shadow: 0 0 30px rgba(0,0,0,0.08);
    }

    .screen {
      display: none;
      flex-direction: column;
      min-height: 100vh;
      padding-bottom: 70px; /* espacio para la barra de navegación */
    }

    .screen.active {
      display: flex;
    }

    /* ===== SPLASH ===== */
    .splash {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      background: linear-gradient(180deg, #FFF5F5 0%, #FFFFFF 65%);
      text-align: center;
    }

    .logo-area svg {
      width: 130px;
      height: 130px;
      margin-bottom: 12px;
    }

    .splash h1 {
      font-size: 34px;
      font-weight: 700;
      color: var(--rojo);
      margin-bottom: 12px;
    }

    .value-prop {
      font-size: 15px;
      color: var(--gris-texto);
      line-height: 1.5;
      max-width: 300px;
      margin-bottom: 40px;
    }

    .btn-paw {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .paw-circle {
      width: 90px;
      height: 90px;
      background: var(--rojo);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(196, 30, 58, 0.35);
    }

    .paw-circle svg {
      width: 36px;
      height: 36px;
      fill: white;
    }

    .btn-paw span {
      font-size: 15px;
      font-weight: 600;
      color: var(--rojo);
    }

    /* ===== HEADER ===== */
    .header {
      padding: 14px 18px;
      background: white;
      border-bottom: 1px solid #eee;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .header .back {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--gris-suave);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
    }

    .header h2 {
      font-size: 17px;
      font-weight: 600;
    }

    /* ===== FORMULARIO ===== */
    .form-content {
      padding: 20px 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex: 1;
    }

    .photo-upload {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .photo-circle {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: var(--gris-suave);
      border: 3px dashed #ccc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--gris-texto);
      font-size: 13px;
      cursor: pointer;
    }

    .photo-circle span {
      font-size: 26px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 6px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 13px 14px;
      border: 1.5px solid #e5e5e5;
      border-radius: 12px;
      font-size: 15px;
      font-family: inherit;
      outline: none;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: var(--rojo);
    }

    .form-group textarea {
      min-height: 75px;
      resize: none;
    }

    .radio-group {
      display: flex;
      gap: 10px;
    }

    .radio-option {
      flex: 1;
      padding: 12px;
      border: 1.5px solid #e5e5e5;
      border-radius: 12px;
      text-align: center;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    .radio-option.active {
      border-color: var(--rojo);
      background: #FEF2F2;
      color: var(--rojo);
    }

    .btn-fixed {
      padding: 14px 18px 24px;
      background: white;
      border-top: 1px solid #eee;
    }

    .btn-primary {
      background: var(--rojo);
      color: white;
      border: none;
      padding: 15px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      width: 100%;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(196, 30, 58, 0.3);
    }

    /* ===== MATCHES ===== */
    .matches-header {
      padding: 10px 18px 6px;
      font-size: 13px;
      color: var(--gris-texto);
    }

    .matches-list {
      padding: 8px 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .pet-card {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 3px 15px rgba(0,0,0,0.07);
      border: 1px solid #f0f0f0;
      cursor: pointer;
    }

    .pet-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .pet-card-body {
      padding: 14px;
    }

    .pet-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 5px;
    }

    .pet-card h3 {
      font-size: 17px;
      font-weight: 600;
    }

    .compat {
      background: #E8F5E9;
      color: var(--verde);
      font-size: 12px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 20px;
    }

    .pet-meta {
      font-size: 12px;
      color: var(--gris-texto);
      margin-bottom: 6px;
    }

    .pet-desc {
      font-size: 13px;
      color: var(--texto);
      line-height: 1.4;
      margin-bottom: 8px;
    }

    .fundacion {
      font-size: 12px;
      color: var(--gris-texto);
    }

    .fundacion::before {
      content: "✓ ";
      color: var(--verde);
      font-weight: 700;
    }

    /* ===== DETALLE ===== */
    .detail-hero {
      width: 100%;
      height: 260px;
      object-fit: cover;
    }

    .detail-content {
      padding: 20px 18px;
    }

    .detail-title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .detail-tags {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .tag {
      background: var(--gris-suave);
      font-size: 12px;
      padding: 5px 11px;
      border-radius: 20px;
      font-weight: 500;
    }

    .section {
      margin-bottom: 16px;
    }

    .section h4 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .section p, .section ul {
      font-size: 13px;
      color: var(--gris-texto);
      line-height: 1.5;
    }

    .section ul {
      list-style: none;
    }

    .section li {
      margin-bottom: 4px;
    }

    .section li::before {
      content: "✓ ";
      color: var(--verde);
      font-weight: 700;
    }

    /* ===== PROCESO ===== */
    .process-content {
      padding: 30px 20px;
      text-align: center;
      flex: 1;
    }

    .success-icon {
      width: 76px;
      height: 76px;
      background: #E8F5E9;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      font-size: 34px;
    }

    .steps {
      display: flex;
      justify-content: space-between;
      position: relative;
      margin: 28px 0 32px;
    }

    .steps::before {
      content: "";
      position: absolute;
      top: 16px;
      left: 28px;
      right: 28px;
      height: 3px;
      background: #e5e5e5;
    }

    .step {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      z-index: 1;
      width: 68px;
    }

    .step-circle {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #e5e5e5;
      color: var(--gris-texto);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 13px;
    }

    .step.active .step-circle,
    .step.completed .step-circle {
      background: var(--verde);
      color: white;
    }

    .step span {
      font-size: 11px;
      color: var(--gris-texto);
    }

    .step.active span {
      color: var(--verde);
      font-weight: 600;
    }

    .info-box {
      background: #F0FDF4;
      border-radius: 14px;
      padding: 14px;
      text-align: left;
      font-size: 13px;
      line-height: 1.5;
    }

    /* ===== SEGUIMIENTO ===== */
    .follow-content {
      padding: 20px 18px;
      flex: 1;
    }

    .timeline-item {
      display: flex;
      gap: 14px;
      margin-bottom: 20px;
      position: relative;
    }

    .timeline-item:not(:last-child)::after {
      content: "";
      position: absolute;
      left: 14px;
      top: 32px;
      bottom: -20px;
      width: 2px;
      background: #e5e5e5;
    }

    .timeline-dot {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #e5e5e5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
    }

    .timeline-item.completed .timeline-dot {
      background: var(--verde);
      color: white;
    }

    .timeline-item.current .timeline-dot {
      background: var(--rojo);
      color: white;
    }

    .timeline-body h4 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 3px;
    }

    .timeline-body p {
      font-size: 12px;
      color: var(--gris-texto);
    }

    .contact-section {
      background: #FFF5F5;
      border-radius: 14px;
      padding: 18px;
      margin-top: 8px;
    }

    .contact-section h4 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .contact-section > p {
      font-size: 12px;
      color: var(--gris-texto);
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .contact-section input {
      width: 100%;
      padding: 12px 13px;
      border: 1.5px solid #e5e5e5;
      border-radius: 11px;
      font-size: 14px;
      margin-bottom: 10px;
      font-family: inherit;
    }

    .btn-contact {
      background: var(--rojo);
      color: white;
      border: none;
      padding: 13px;
      border-radius: 11px;
      font-size: 14px;
      font-weight: 600;
      width: 100%;
      cursor: pointer;
    }

    /* ===== HOME ===== */
    .profile-header {
      padding: 28px 18px;
      text-align: center;
      background: linear-gradient(180deg, #FFF5F5 0%, #fff 100%);
    }

    .avatar {
